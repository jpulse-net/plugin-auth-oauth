/**
 * @name            jPulse Framework / Plugins / Auth-OAuth / WebApp / Bump Version Configuration
 * @tagline         Bump version script configuration for the Auth-OAuth Plugin
 * @description     Configuration file for version bumping across plugin files
 * @file            plugins/auth-oauth/webapp/bump-version.conf
 * @version         1.0.5
 * @release         2026-09-30
 * @repository      https://github.com/jpulse-net/plugin-auth-oauth
 * @author          Peter Thoeny, https://twiki.org & https://github.com/peterthoeny/
 * @copyright       2025-2026 Peter Thoeny, https://twiki.org & https://github.com/peterthoeny/
 * @license         BSL 1.1 -- see LICENSE file; for commercial use: team@jpulse.net
 * @genai           80%, Cursor 3.12, Claude Sonnet 5
 */

{
    // File patterns to include in version bump
    filePatterns: [
        // Root level
        'README.md',
        'plugin.json',
        'package.json',
        'package-lock.json',

        // Docs directory
        'docs/*.md',
        'docs/**/*.md',

        // Plugin directory
        'webapp/*.conf',
        'webapp/controller/*.js',
        'webapp/model/*.js',
        'webapp/utils/*.js',
        'webapp/view/*.css',
        'webapp/view/*.js',
        'webapp/view/*.tmpl',
        'webapp/view/**/*.css',
        'webapp/view/**/*.js',
        'webapp/view/**/*.shtml',
        'webapp/view/**/*.tmpl',

        // Test files
        'webapp/tests/**/*.js',
        'webapp/tests/**/*.conf',
        'webapp/tests/**/*.sh',
        'webapp/tests/**/*.md'
    ],

    // File update rules with regex patterns
    fileUpdateRules: [
        {
            pattern: 'README.md',
            replacements: [
                { from: /^(# .* v)[\d.]+(-[a-z]+\.\d+)?/m,
                  to: (version, match, p1) => `${p1}${version}` }
            ]
        },
        {
            pattern: 'plugin.json',
            replacements: [
                {
                    from: /"version": "[\d.]+(-[a-z]+\.\d+)?"/,
                    to: (version) => `"version": "${version}"`
                }
            ]
        },
        {
            pattern: 'package.json',
            replacements: [
                {
                    from: /"version": "[\d.]+(-[a-z]+\.\d+)?"/,
                    to: (version) => `"version": "${version}"`
                }
            ]
        },
        {
            pattern: 'package-lock.json',
            replacements: [
                { from: /"version": "[\d.]+(-[a-z]+\.\d+)?"/,
                    to: (version) => `"version": "${version}"` },
                { from: /("": \{\s+"name": "[^\"]+",\s+"version": ")[\d.]+(-[a-z]+\.\d+)?/,
                    to: (version, match, p1) => `${p1}${version}`, scope: 'version' }
            ]
        },
        {
            pattern: 'docs/*.md',
            replacements: [
                { from: /^(# .* v)[\d.]+(-[a-z]+\.\d+)?/m,
                  to: (version, match, p1) => `${p1}${version}` }
            ]
        },
        {
            pattern: 'docs/**/*.md',
            replacements: [
                { from: /^(# .* v)[\d.]+(-[a-z]+\.\d+)?/m,
                  to: (version, match, p1) => `${p1}${version}` }
            ]
        }
    ],

    // Header update patterns (optional - uses defaults if not specified)
    headerUpdatePatterns: {
        version: /([\*#] @version\s+)[\d.]+(-[a-z]+\.\d+)?/,
        release: /([\*#] @release\s+)[\d-]+/
    }
}

// EOF plugins/auth-oauth/webapp/bump-version.conf
